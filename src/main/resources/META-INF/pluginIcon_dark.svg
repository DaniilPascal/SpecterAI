<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDark" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F5C38"/>
      <stop offset="0.45" stop-color="#1E3A6E"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="2" y="2" width="36" height="36" rx="9" fill="url(#bgDark)"/>
  <!-- Letter P -->
  <path fill="#F8FAFC"
        d="M12.2 10.2h8.4c3.8 0 6.35 2.3 6.35 5.8 0 3.55-2.55 5.85-6.4 5.85H16.2V29.8h-4V10.2zm4 8.05h4.15c1.75 0 2.8-0.95 2.8-2.3s-1.05-2.25-2.8-2.25H16.2v4.55z"/>

  <!-- Yellow: selecting a code strip -->
  <rect x="4.3" y="16.2" width="7.5" height="3.2" rx="0.6" fill="#FACC15" opacity="0.45"/>
  <rect x="4.8" y="17.1" width="5.2" height="1.2" rx="0.4" fill="#F8FAFC" opacity="0.7"/>

  <!-- Green: clicking the P (click ripple) -->
  <circle cx="29.6" cy="15.6" r="3.0" fill="none" stroke="#22C55E" stroke-width="0.9" opacity="0.85"/>
  <circle cx="29.6" cy="15.6" r="1.35" fill="#22C55E" opacity="0.55"/>

  <!-- Blue: typing under P -->
  <rect x="14.2" y="31.0" width="6.2" height="1.15" rx="0.4" fill="#F8FAFC" opacity="0.75"/>
  <rect x="14.2" y="33.0" width="4.0" height="1.15" rx="0.4" fill="#F8FAFC" opacity="0.55"/>
  <rect x="20.6" y="30.8" width="1.0" height="3.4" rx="0.4" fill="#3B82F6"/>

  <!-- Violet: dragging a marquee box -->
  <rect x="27.8" y="25.5" width="7.2" height="6.0" rx="0.8"
        fill="#A855F7" fill-opacity="0.18" stroke="#A855F7" stroke-width="0.85" stroke-dasharray="1.6 1.1"/>
  <circle cx="34.8" cy="31.3" r="1.05" fill="#A855F7"/>

  <!-- 4 cursors -->
  <g stroke="#F8FAFC" stroke-width="0.45" stroke-linejoin="round">
    <!-- yellow — selecting left -->
    <path fill="#FACC15" transform="translate(3.8,14.0) scale(0.46)"
          d="M0 0 L0 11.8 L2.9 9.1 L5.6 14.6 L7.8 13.6 L5.0 8.0 L8.7 8.0 Z"/>
    <!-- green — clicking mid-right -->
    <path fill="#22C55E" transform="translate(28.4,13.2) scale(0.44)"
          d="M0 0 L0 11.8 L2.9 9.1 L5.6 14.6 L7.8 13.6 L5.0 8.0 L8.7 8.0 Z"/>
    <!-- blue — typing under P -->
    <path fill="#3B82F6" transform="translate(20.0,28.6) scale(0.44)"
          d="M0 0 L0 11.8 L2.9 9.1 L5.6 14.6 L7.8 13.6 L5.0 8.0 L8.7 8.0 Z"/>
    <!-- violet — dragging bottom-right -->
    <path fill="#A855F7" transform="translate(30.8,27.2) scale(0.44)"
          d="M0 0 L0 11.8 L2.9 9.1 L5.6 14.6 L7.8 13.6 L5.0 8.0 L8.7 8.0 Z"/>
  </g>
</svg>
